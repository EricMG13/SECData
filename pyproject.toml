[project]
name = "secdata"
version = "0.1.0"
description = "Issuer corpus and minimum filing packs from SEC EDGAR, for offline credit analysis"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
